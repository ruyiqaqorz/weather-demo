<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>晴空 · 天气</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .location-button{gap:9px;line-height:1}.location-button #city-name{line-height:20px;white-space:nowrap}.location-icon{display:grid;place-items:center;width:16px;height:20px;flex:0 0 16px;line-height:1}.location-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}.location-icon svg circle{fill:currentColor;stroke:none}.location-button .chevron{display:grid;place-items:center;width:12px;height:20px;margin-left:1px;line-height:1}.location-button .chevron svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.search{gap:9px}.search-icon{display:grid;place-items:center;width:17px;height:20px;flex:0 0 17px;line-height:1}.search-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}.search input{height:20px;line-height:20px;padding:0}
      body{background:linear-gradient(145deg,#f6f9fc 0%,#eef5f8 100%)}.metrics-card,.forecast-card,.hourly-card,.tip-card,.current-card{background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.78);box-shadow:0 14px 34px rgba(35,62,96,.055);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.current-card{color:#17274a;background:rgba(255,255,255,.75);box-shadow:0 14px 34px rgba(35,62,96,.07)}.current-card:before{content:"";position:absolute;width:250px;height:250px;right:-70px;top:-130px;background:radial-gradient(circle,#e8f6ff 0%,#f8fcff00 68%);z-index:0}.current-card>*{position:relative;z-index:1}.hero-top{color:#74829a;opacity:1}.temperature{color:#236fe0}.condition{color:#1c2e52}.feels{color:#8793a8;opacity:1}.current-footer{border-color:#e7edf4}.current-footer small{color:#95a1b3;opacity:1}.current-footer b{color:#445470}.current-footer span{color:#4c8cef}.cloud-decoration{display:none}.tip-card{background:rgba(255,255,255,.68)}.forecast-row{border-color:rgba(218,227,237,.72)}.hourly-chart{height:128px;padding-top:8px;align-items:stretch}.hour{display:grid;grid-template-rows:16px 64px 16px;justify-items:center;align-items:center;gap:5px}.hour b{line-height:16px}.bar-wrap{height:64px;align-self:end}.hour small{line-height:16px}.sun-wrap{filter:drop-shadow(0 8px 12px rgba(52,112,196,.14))}
      .welcome-row{display:grid;grid-template-columns:minmax(0,1fr) 250px 207px;gap:24px;align-items:center;margin:16px 0 20px}.character-showcase{height:198px;position:relative;isolation:isolate;overflow:hidden;margin-left:-46px;border-radius:24px;background:transparent;border:0;box-shadow:none}.character-showcase:before{content:"";position:absolute;inset:-18px;background:url('assets/mikasa-chibi.png') center 30%/cover no-repeat;filter:blur(20px) saturate(.6);opacity:.13;z-index:-2}.character-showcase:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(246,250,252,.64),transparent 50%),linear-gradient(0deg,rgba(245,249,251,.72),transparent 42%);z-index:-1}.character-showcase img{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);height:230px;width:auto;mix-blend-mode:multiply;filter:saturate(.82) contrast(.95) brightness(1.05);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 25%,#000 75%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 25%,#000 75%,transparent 100%);transition:transform .3s ease}.character-showcase:hover img{transform:translateX(-50%) translateY(-4px) rotate(-1deg)}.character-caption{display:none}.welcome-row .search{justify-self:end}.hourly-chart{height:126px;padding-top:4px}.hour{height:112px;align-self:end;grid-template-rows:18px 54px 18px;gap:7px;align-content:end}.hour b{align-self:end;padding-bottom:2px}.bar-wrap{height:54px;margin-top:5px}.hour small{align-self:start;padding-top:1px}@media(max-width:900px){.welcome-row{grid-template-columns:1fr 180px;gap:14px}.character-showcase{display:none}.welcome-row .search{grid-column:2}}@media(max-width:540px){.welcome-row{display:flex}.welcome-row .search{display:none}}
    </style>
  </head>
  <body>
    <main class="app-shell">
      <nav class="topbar">
        <a class="brand" href="#"><span class="brand-mark">☼</span>晴空</a>
        <div class="nav-actions">
          <button class="location-button" aria-label="切换位置"><span class="location-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s6-5.1 6-11A6 6 0 1 0 6 10c0 5.9 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg></span><span id="city-name">衡阳市</span><span class="chevron" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></span></button>
          <button class="icon-button" aria-label="通知">◌<i></i></button>
          <button class="avatar" aria-label="个人中心">R</button>
        </div>
      </nav>
      <section class="welcome-row">
        <div><p class="eyebrow" id="today-label">正在获取天气…</p><h1>周灿咪，今天也要坤气满满！</h1></div>
        <aside class="character-showcase" aria-label="三笠静态展示"><img src="assets/mikasa-chibi.png" alt="Q版三笠日常形象" /></aside>
        <div class="search"><span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15.2 15.2 4.2 4.2"/></svg></span><input id="city-search" placeholder="搜索城市" aria-label="搜索城市" /></div>
      </section>
      <section class="hero-grid">
        <article class="current-card">
          <div class="hero-top"><span>当前天气</span><span id="updated-time">刚刚更新</span></div>
          <div class="current-main"><div><div class="temperature"><span id="temp">--</span><sup>°</sup></div><p class="condition" id="condition">加载中</p><p class="feels">体感温度 <b id="feels">--°</b></p></div><div class="sun-wrap" aria-label="天气图标"><div class="sun"><span></span></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div></div></div>
          <div class="current-footer"><div><span>◒</span><small>日出</small><b id="sunrise">--:--</b></div><div><span>◔</span><small>日落</small><b id="sunset">--:--</b></div><div><span>◉</span><small>降水概率</small><b id="rain-chance">--%</b></div></div>
          <div class="cloud-decoration cloud-a"></div><div class="cloud-decoration cloud-b"></div>
        </article>
        <article class="metrics-card">
          <div class="card-heading"><h2>今日详情</h2><span class="more">···</span></div>
          <div class="metric-grid">
            <div class="metric"><span class="metric-icon wind">⌁</span><p>风速</p><strong><span id="wind">--</span> <em>km/h</em></strong><small id="wind-direction">--</small></div>
            <div class="metric"><span class="metric-icon drop">♢</span><p>湿度</p><strong><span id="humidity">--</span><em>%</em></strong><div class="meter"><i id="humidity-meter" style="width:0%"></i></div></div>
            <div class="metric"><span class="metric-icon sun-icon">☼</span><p>紫外线</p><strong><span id="uv">--</span> <em>/ 10</em></strong><small class="orange" id="uv-level">--</small></div>
            <div class="metric"><span class="metric-icon visibility">◉</span><p>能见度</p><strong><span id="visibility">--</span> <em>km</em></strong><small id="visibility-level">--</small></div>
          </div>
        </article>
      </section>
      <section class="content-grid">
        <article class="forecast-card"><div class="card-heading"><div><p class="eyebrow">未来 7 天</p><h2>天气预报</h2></div><button class="text-button">查看详情 <span>→</span></button></div><div class="forecast-list" id="forecast-list"></div></article>
        <aside class="right-column">
          <article class="tip-card"><div class="tip-icon">☀</div><div><p>今日贴士</p><h3>阳光正好，适合出门走走</h3><span>紫外线中等，记得做好防晒</span></div></article>
          <article class="hourly-card"><div class="card-heading"><h2>逐小时预报</h2><span class="mini-label">降水概率</span></div><div class="hourly-chart" id="hourly-chart"></div></article>
        </aside>
      </section>
      <footer>晴空天气 · 数据仅用于演示</footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
